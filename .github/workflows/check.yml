name: check

on:
  pull_request:
  push:
    branches: [main]

# Everyone runs `main` — there are no versions and no staging (ADR 0009), so
# a bad merge is live for thirty people immediately. This is the automated half
# of the safety net; the curator is the other half (ADR 0010).
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # check.py is stdlib-only on purpose: nothing to install, and a
      # contributor can run the identical command locally before pushing. Two
      # checks used to live in this file as inline Python, which meant nobody
      # could run them locally at all and each one stopped at its first
      # complaint. They are `onboarding` and `readme` in check.py now.
      - name: Manifests, skills, secrets, runtime invariants, and what the docs promise
        run: python3 .github/scripts/check.py

      # The Rock runtime is the one place in this repo where a plausible
      # request and a correct one look identical in review: Rock's PUT replaces
      # the whole entity, its attribute-value route binds from the query string,
      # and a capped read prints its cap as a total. These tests assert the
      # method and the URL of every write and the count of every read, with a
      # recording fake in place of the client — no Rock, no network, stdlib
      # only. They also run the checks above against source built to fail them,
      # because a green check does not prove the check still bites. See ADR 0022.
      - name: Every Rock request, and every check that guards one
        run: python3 -m unittest discover -s tests -v
